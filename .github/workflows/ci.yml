name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Import smoke test
        run: uv run python -c "import main; print('All imports OK')"

      - name: Test (pytest)
        run: uv run pytest

      # Install the built wheel in a clean environment, outside the checkout, so an
      # undeclared dependency (e.g. mplfinance needing six) fails here, not for users.
      - name: Package smoke test
        run: |
          uv build --wheel -o dist
          cd "$RUNNER_TEMP"
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl python -c "import tearsheet.__main__; from tearsheet.server import mcp; print(mcp.name)"
