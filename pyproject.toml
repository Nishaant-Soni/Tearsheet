[project]
name = "tearsheet"
version = "0.1.0"
description = "An MCP server for stock research on Yahoo Finance data: prices, financial statements, fundamental ratios, technical indicators, backtests and charts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.3",
    "mcp>=2.3.0",
    "mplfinance>=0.12.10b0",
    "pandas>=2.3.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — formatter handles this
    "F841",  # local variable assigned but never used
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the network (skipped by default; run with -m live)"]
addopts = "-m 'not live'"
