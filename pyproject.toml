[project]
name = "tearsheet"
version = "1.0.0"
description = "An MCP server for stock research on Yahoo Finance data: prices, financial statements, fundamental ratios, technical indicators, backtests and charts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.3",
    "mcp>=2.3.0",
    "mplfinance>=0.12.10b0",
    "pandas>=2.3.0",
    "six>=1.16",  # mplfinance imports six without declaring it
    "yfinance>=1.8.0",
]

[project.scripts]
tearsheet = "tearsheet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tearsheet"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — formatter handles this
    "F841",  # local variable assigned but never used
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the network (skipped by default; run with -m live)"]
addopts = "-m 'not live'"
